name: Actualizar datos

on:
  schedule:
    - cron: "40 5 * * *"   # cada día a las 05:40 UTC (07:40 en Madrid en verano), con el día anterior ya cerrado
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar, validar y fusionar los datos
        run: python scripts/actualizar.py

      - name: Guardar los cambios, si los hay
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Datos actualizados: $(date -u +%Y-%m-%d)"
            git push
          fi
